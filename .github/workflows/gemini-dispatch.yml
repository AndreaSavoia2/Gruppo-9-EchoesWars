name: Gemini PR Review

on:
  pull_request:
    branches:
      - backend
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Do not run with write permissions on code coming from a fork.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/gemini-review.yml
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    secrets: inherit

